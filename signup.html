<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MCA Portal Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-box">
      <div class="auth-icon">✦</div>
      <h1>Create Account</h1>
      <p>Register a local demonstration account</p>
      <form id="signupForm">
        <div class="mb-3">
          <label for="newUser" class="form-label">Username</label
          ><input id="newUser" class="form-control" required minlength="3" />
        </div>
        <div class="mb-3">
          <label for="newPass" class="form-label">Password</label
          ><input
            id="newPass"
            type="password"
            class="form-control"
            required
            minlength="4"
          />
        </div>
        <button class="btn" type="submit">Register</button>
        <div id="feedback" class="mt-3" aria-live="polite"></div>
      </form>
      <p class="mt-3">Already registered? <a href="login.html">Login</a></p>
      <p><a href="index.html">← Back to department website</a></p>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
