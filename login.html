<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MCA Portal Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-box">
      <div class="auth-icon"><i class="bi bi-mortarboard"></i></div>
      <h1>MCA Department Portal</h1>
      <p>Login to your demo account</p>
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label
          ><input id="username" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label
          ><input id="password" type="password" class="form-control" required />
        </div>
        <button class="btn" type="submit">Login</button>
        <div id="feedback" class="mt-3" aria-live="polite"></div>
      </form>
      <p class="mt-3">New user? <a href="signup.html">Create an account</a></p>
      <p><a href="index.html">← Back to department website</a></p>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
